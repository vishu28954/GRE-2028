<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#FFF8E1"/>
  <rect x="45" y="40" width="1110" height="340" rx="28" fill="#FFFFFF" stroke="#F9A825" stroke-width="4"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#E65100">EXTOL</text>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="25" fill="#F57F17">enthusiastic, elaborate praise</text>
  <rect x="120" y="210" width="245" height="105" rx="20" fill="#FFE082" stroke="#EF6C00" stroke-width="3"/>
  <text x="150" y="255" font-family="Arial, sans-serif" font-size="34" fill="#333">Reviewer</text>
  <text x="150" y="295" font-family="Arial, sans-serif" font-size="26" fill="#333">keeps praising</text>
  <path d="M430 120 C620 60, 750 145, 900 90" fill="none" stroke="#F9A825" stroke-width="12" stroke-linecap="round"/>
  <text x="430" y="200" font-family="Arial, sans-serif" font-size="30" fill="#333">“Amazing...”</text>
