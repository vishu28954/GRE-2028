  <text x="805" y="300" font-family="Arial, sans-serif" font-size="30" fill="#333">“Unmatched...”</text>
  <text x="455" y="348" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#E65100">Not one compliment — a stream of praise.</text>
