<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#FCE4EC"/>
  <rect x="45" y="40" width="1110" height="340" rx="28" fill="#FFFFFF" stroke="#AD1457" stroke-width="4"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#880E4F">DERIDE</text>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="25" fill="#AD1457">mock or ridicule contemptuously</text>
  <text x="135" y="250" font-family="Arial, sans-serif" font-size="58" fill="#333">😂 😂 😂</text>
  <text x="500" y="210" font-family="Arial, sans-serif" font-size="32" fill="#333">Inventor: “This could work.”</text>
  <text x="500" y="260" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#880E4F">Crowd: “Ridiculous!”</text>
  <text x="500" y="318" font-family="Arial, sans-serif" font-size="26" fill="#555">criticism mixed with laughter and contempt</text>
</svg>