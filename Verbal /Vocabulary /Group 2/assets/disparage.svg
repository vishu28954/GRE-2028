<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#F5F5F5"/>
  <rect x="45" y="40" width="1110" height="340" rx="28" fill="#FFFFFF" stroke="#424242" stroke-width="4"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#212121">DISPARAGE</text>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="25" fill="#424242">make something seem less valuable</text>
  <rect x="125" y="205" width="240" height="115" rx="16" fill="#E0E0E0" stroke="#424242" stroke-width="3"/>
  <text x="150" y="250" font-family="Arial, sans-serif" font-size="28" fill="#333">Achievement</text>
  <text x="150" y="290" font-family="Arial, sans-serif" font-size="35" fill="#2E7D32">✓✓✓</text>
  <text x="500" y="215" font-family="Arial, sans-serif" font-size="34" fill="#333">“Anyone could have done that.”</text>
  <text x="500" y="275" font-family="Arial, sans-serif" font-size="27" fill="#555">belittling the value of real work</text>
  <text x="500" y="325" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#212121">not disagreement — diminution</text>
</svg>