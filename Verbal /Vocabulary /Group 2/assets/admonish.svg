<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#FFFDE7"/>
  <rect x="45" y="40" width="1110" height="340" rx="28" fill="#FFFFFF" stroke="#F9A825" stroke-width="4"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#F57F17">ADMONISH</text>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="25" fill="#F9A825">warn + correct</text>
  <rect x="120" y="205" width="280" height="110" rx="18" fill="#FFF59D" stroke="#F57F17" stroke-width="3"/>
  <text x="155" y="252" font-family="Arial, sans-serif" font-size="30" fill="#333">Parent:</text>
  <text x="155" y="292" font-family="Arial, sans-serif" font-size="25" fill="#333">firm but caring</text>
  <text x="500" y="215" font-family="Arial, sans-serif" font-size="32" fill="#333">“Don’t run across the road.”</text>
  <text x="500" y="265" font-family="Arial, sans-serif" font-size="32" fill="#333">“You could get hurt.”</text>
  <text x="500" y="325" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#F57F17">a warning meant to improve behavior</text>
</svg>