<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#FFEBEE"/>
  <rect x="45" y="40" width="1110" height="340" rx="28" fill="#FFFFFF" stroke="#B71C1C" stroke-width="4"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#B71C1C">CENSURE</text>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="25" fill="#C62828">strong formal disapproval</text>
  <rect x="120" y="205" width="300" height="115" rx="16" fill="#FFCDD2" stroke="#B71C1C" stroke-width="3"/>
  <text x="158" y="253" font-family="Arial, sans-serif" font-size="31" fill="#B71C1C">Ethics Board</text>
  <text x="158" y="292" font-family="Arial, sans-serif" font-size="25" fill="#333">official statement</text>
  <text x="520" y="210" font-family="Arial, sans-serif" font-size="32" fill="#333">“This conduct is unacceptable.”</text>
  <text x="520" y="268" font-family="Arial, sans-serif" font-size="26" fill="#555">not casual criticism</text>
  <text x="520" y="315" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#B71C1C">formal condemnation</text>
</svg>