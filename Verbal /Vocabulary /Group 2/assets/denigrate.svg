<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#F3E5F5"/>
  <rect x="45" y="40" width="1110" height="340" rx="28" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="4"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#4A148C">DENIGRATE</text>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="25" fill="#7B1FA2">drag reputation or worth down</text>
  <line x1="250" y1="175" x2="250" y2="320" stroke="#7B1FA2" stroke-width="8"/>
  <polygon points="250,335 215,285 285,285" fill="#7B1FA2"/>
  <text x="130" y="165" font-family="Arial, sans-serif" font-size="30" fill="#333">Reputation</text>
  <text x="115" y="360" font-family="Arial, sans-serif" font-size="28" fill="#333">pulled down</text>
  <text x="480" y="215" font-family="Arial, sans-serif" font-size="32" fill="#333">“Her achievements are insignificant.”</text>
  <text x="480" y="275" font-family="Arial, sans-serif" font-size="27" fill="#555">unfair belittling of credibility</text>
  <text x="480" y="325" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#4A148C">attack reputation, not just argument</text>
