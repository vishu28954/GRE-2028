<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#FFEBEE"/>
  <rect x="45" y="40" width="1110" height="340" rx="28" fill="#FFFFFF" stroke="#B71C1C" stroke-width="4"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#B71C1C">VILIFY</text>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="25" fill="#C62828">turn someone into a villain</text>
  <rect x="130" y="190" width="260" height="140" rx="18" fill="#FFCDD2" stroke="#B71C1C" stroke-width="3"/>
  <text x="165" y="240" font-family="Arial, sans-serif" font-size="31" fill="#B71C1C">Campaign Poster</text>
  <text x="165" y="285" font-family="Arial, sans-serif" font-size="30" fill="#333">VILLAIN!</text>
  <text x="500" y="210" font-family="Arial, sans-serif" font-size="32" fill="#333">not policy criticism</text>
  <text x="500" y="260" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#B71C1C">a character attack</text>
  <text x="500" y="318" font-family="Arial, sans-serif" font-size="26" fill="#555">portrays someone as wicked or dangerous</text>
</svg>